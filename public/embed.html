<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dishylink summary</title>
    <!--
      A compact, framable summary card for home dashboards. It reads only what the
      history recorder has already stored (/api/*), never the dish or router, so an
      embed left open all day adds no load to either. Clicking it opens the full
      dashboard in the top window.

      Query parameters:
        open     URL the card links to (http/https only; default "/")
        theme    dark | light | system (default system)
        minutes  sparkline window, 5–60 (default 15)
    -->
    <style>
      :root {
        --page: #000000;
        --surface: #0c0c0c;
        --line: #262626;
        --ink: #ffffff;
        --ink-muted: #8a8a8a;
        --ok: #34d399;
        --warn: #fbbf24;
        --bad: #f87171;
        --idle: #737373;
        --down: #60a5fa;
        color-scheme: dark;
      }
      :root[data-theme="light"] {
        --page: #ffffff;
        --surface: #f6f6f6;
        --line: #e2e2e2;
        --ink: #0a0a0a;
        --ink-muted: #6b6b6b;
        --ok: #059669;
        --warn: #b45309;
        --bad: #dc2626;
        --idle: #8a8a8a;
        --down: #2563eb;
        color-scheme: light;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--page);
        color: var(--ink);
        font:
          14px/1.3 system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          sans-serif;
      }
      a.card {
        display: flex;
        flex-direction: column;
        gap: 10px;
        height: 100%;
        padding: 12px 14px;
        color: inherit;
        text-decoration: none;
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 12px;
      }
      a.card:hover {
        border-color: var(--ink-muted);
      }
      .head {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .dot {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: var(--idle);
        flex: none;
      }
      .title {
        font-weight: 600;
      }
      .state {
        color: var(--ink-muted);
      }
      .age {
        margin-left: auto;
        color: var(--ink-muted);
        font-size: 12px;
      }
      .tiles {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 8px;
      }
      .tile .label {
        color: var(--ink-muted);
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }
      .tile .value {
        font-size: 18px;
        font-weight: 600;
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
      }
      .tile .unit {
        font-size: 12px;
        font-weight: 400;
        color: var(--ink-muted);
        margin-left: 2px;
      }
      svg.spark {
        width: 100%;
        height: 40px;
        flex: 1 1 40px;
        min-height: 28px;
      }
      .foot {
        color: var(--ink-muted);
        font-size: 12px;
      }
      @media (max-width: 340px) {
        .tiles {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
      }
    </style>
    <script>
      (function () {
        var theme = new URLSearchParams(location.search).get("theme") || "system";
        if (theme === "system") {
          theme = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
        }
        document.documentElement.dataset.theme = theme === "light" ? "light" : "dark";
      })();
    </script>
  </head>
  <body>
    <a class="card" id="card" target="_top" href="/">
      <div class="head">
        <span class="dot" id="dot"></span>
        <span class="title">Starlink</span>
        <span class="state" id="state">Loading…</span>
        <span class="age" id="age"></span>
      </div>
      <div class="tiles">
        <div class="tile">
          <div class="label">Down</div>
          <div class="value" id="down">–</div>
        </div>
        <div class="tile">
          <div class="label">Up</div>
          <div class="value" id="up">–</div>
        </div>
        <div class="tile">
          <div class="label">Latency</div>
          <div class="value" id="latency">–</div>
        </div>
        <div class="tile">
          <div class="label">Ping OK</div>
          <div class="value" id="ping">–</div>
        </div>
      </div>
      <svg
        class="spark"
        id="spark"
        viewBox="0 0 100 40"
        preserveAspectRatio="none"
        aria-hidden="true"
      >
        <polyline
          id="sparkLine"
          fill="none"
          stroke="var(--down)"
          stroke-width="1.5"
          vector-effect="non-scaling-stroke"
          points=""
        />
      </svg>
      <div class="foot" id="foot"></div>
    </a>
    <script>
      (function () {
        var params = new URLSearchParams(location.search);
        var minutes = Math.min(60, Math.max(5, Number(params.get("minutes")) || 15));
        var open = params.get("open");
        if (open && /^https?:\/\//i.test(open)) document.getElementById("card").href = open;

        var STALE_MS = 90000;
        var REFRESH_MS = 30000;
        var latest = null;

        function el(id) {
          return document.getElementById(id);
        }
        function setValue(id, number, unit) {
          var node = el(id);
          node.textContent = number;
          if (unit) {
            var span = document.createElement("span");
            span.className = "unit";
            span.textContent = unit;
            node.appendChild(span);
          }
        }
        function rate(bps) {
          if (bps >= 1e9) return [(bps / 1e9).toFixed(2), "Gbps"];
          if (bps >= 1e6) return [(bps / 1e6).toFixed(bps >= 1e8 ? 0 : 1), "Mbps"];
          return [Math.round(bps / 1e3).toString(), "kbps"];
        }
        function ago(ms) {
          var s = Math.max(0, Math.round(ms / 1000));
          if (s < 60) return s + "s ago";
          var m = Math.round(s / 60);
          if (m < 60) return m + "m ago";
          var h = Math.round(m / 60);
          if (h < 48) return h + "h ago";
          return Math.round(h / 24) + "d ago";
        }
        function span(ms) {
          var s = Math.round(ms / 1000);
          if (s < 60) return s + "s";
          var m = Math.round(s / 60);
          return m < 60 ? m + "m" : Math.floor(m / 60) + "h " + (m % 60) + "m";
        }
        function mean(list, pick) {
          var total = 0;
          var count = 0;
          list.forEach(function (item) {
            var value = pick(item);
            if (value !== null && Number.isFinite(value)) {
              total += value;
              count++;
            }
          });
          return count ? total / count : null;
        }
        async function getJson(path) {
          var response = await fetch(path, { cache: "no-store" });
          if (!response.ok) throw new Error(path + " " + response.status);
          return response.json();
        }

        function paintStatus() {
          var color = "--idle";
          var label = "Not recording";
          if (latest && Date.now() - latest.timestampMs < STALE_MS) {
            if (latest.latencyMs === null || latest.dropRate >= 0.99) {
              color = "--bad";
              label = "Offline";
            } else if (latest.dropRate > 0.05) {
              color = "--warn";
              label = "Degraded";
            } else {
              color = "--ok";
              label = "Online";
            }
          }
          el("dot").style.background = "var(" + color + ")";
          el("state").textContent = label;
          el("age").textContent = latest ? ago(Date.now() - latest.timestampMs) : "";
        }

        function paintSamples(samples) {
          latest = samples.length ? samples[samples.length - 1] : null;
          // Smooth the headline numbers over the last ~10 s so one quiet second
          // doesn't read as the link dropping to zero.
          var recent = samples.slice(-10);
          var down = mean(recent, function (s) {
            return s.downlinkBps;
          });
          var up = mean(recent, function (s) {
            return s.uplinkBps;
          });
          var lat = mean(recent, function (s) {
            return s.latencyMs;
          });
          var drop = mean(samples.slice(-60), function (s) {
            return s.dropRate;
          });
          if (down !== null) setValue("down", rate(down)[0], rate(down)[1]);
          if (up !== null) setValue("up", rate(up)[0], rate(up)[1]);
          setValue(
            "latency",
            lat === null ? "–" : Math.round(lat).toString(),
            lat === null ? "" : "ms",
          );
          setValue(
            "ping",
            drop === null ? "–" : (100 * (1 - drop)).toFixed(drop < 0.001 ? 0 : 1),
            drop === null ? "" : "%",
          );

          // Down-rate sparkline, bucketed to ~100 points.
          var line = el("sparkLine");
          if (samples.length < 2) {
            line.setAttribute("points", "");
            return;
          }
          var start = samples[0].timestampMs;
          var width = Math.max(1, samples[samples.length - 1].timestampMs - start);
          var buckets = [];
          samples.forEach(function (s) {
            var index = Math.min(99, Math.floor(((s.timestampMs - start) / width) * 100));
            buckets[index] = Math.max(buckets[index] || 0, s.downlinkBps);
          });
          var peak = Math.max.apply(null, buckets.filter(Number.isFinite).concat([1]));
          var points = [];
          buckets.forEach(function (value, index) {
            if (Number.isFinite(value))
              points.push(index + "," + (38 - (value / peak) * 36).toFixed(1));
          });
          line.setAttribute("points", points.join(" "));
        }

        function paintFoot(usage, outages) {
          var parts = [];
          if (usage && Number.isFinite(usage.totalDownGB)) {
            parts.push(
              "Today " +
                usage.totalDownGB.toFixed(1) +
                " GB down · " +
                usage.totalUpGB.toFixed(1) +
                " GB up",
            );
          }
          var events = (outages && outages.events) || [];
          if (events.length) {
            var last = events.reduce(function (a, b) {
              return b.startMs > a.startMs ? b : a;
            });
            parts.push(
              "last outage " +
                ago(Date.now() - last.startMs - last.durationMs) +
                " (" +
                span(last.durationMs) +
                ")",
            );
          } else if (outages) {
            parts.push("no outages recorded");
          }
          el("foot").textContent = parts.join(" · ");
        }

        async function refresh() {
          try {
            var results = await Promise.allSettled([
              getJson("/api/samples?minutes=" + minutes),
              getJson("/api/usage?range=today"),
              getJson("/api/outages"),
            ]);
            if (results[0].status === "fulfilled") paintSamples(results[0].value.samples || []);
            else latest = null;
            paintFoot(
              results[1].status === "fulfilled" ? results[1].value : null,
              results[2].status === "fulfilled" ? results[2].value : null,
            );
          } finally {
            paintStatus();
          }
        }

        refresh();
        setInterval(refresh, REFRESH_MS);
        setInterval(paintStatus, 5000);
      })();
    </script>
  </body>
</html>
